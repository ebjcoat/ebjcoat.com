<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Black Fullscreen Page</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      background-color: black;
      height: 100%;
      width: 100%;
      overflow: hidden;
      /*cursor: none; /* Optional: hides the cursor for a cleaner fullscreen feel */
    }
  </style>
</head>
<body ondblclick="toggleFullscreen()">

<script>
  function toggleFullscreen() {
    if (!document.fullscreenElement) {
      document.documentElement.requestFullscreen().catch(err => {
        console.warn(`Error attempting to enter fullscreen mode: ${err.message}`);
      });
    } else {
      document.exitFullscreen();
    }
  }
</script>

</body>
</html>
